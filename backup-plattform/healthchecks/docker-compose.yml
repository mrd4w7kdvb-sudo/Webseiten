# Überwachung auf einem SEPARATEN kleinen vServer (möglichst anderer Anbieter als der Backup-Server).
# Meldet, wenn eine Sicherung fehlschlägt oder ausbleibt – auch wenn der Backup-Server selbst ausfällt.
#
# Start:  cp env.example .env  (anpassen)  &&  docker compose up -d
# Admin:  docker compose exec healthchecks /opt/healthchecks/manage.py createsuperuser

services:
  healthchecks:
    # Version vor Einsatz festlegen, z. B. healthchecks/healthchecks:v3.x (siehe hub.docker.com)
    image: healthchecks/healthchecks:${HC_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DB: sqlite
      DB_NAME: /data/hc.sqlite
      REGISTRATION_OPEN: "False"
      PING_BODY_LIMIT: "100000"
    volumes:
      - hc_data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      HC_DOMAIN: ${HC_DOMAIN:?HC_DOMAIN in .env setzen}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  hc_data:
  caddy_data:
  caddy_config:
